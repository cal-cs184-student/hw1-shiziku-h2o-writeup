<?xml version="1.0" encoding="utf-8"?>
<!-- A tweaked cubeman: the right arm is rotated to look like a wave. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="500.0px" height="500.0px" viewBox="0 0 500 500">

<g transform="translate(250 250)">
    <!-- torso -->
    <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
    <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>

    <!-- head -->
    <g transform="translate(0 -100)">
        <g transform="rotate(45)">
            <g transform="scale(.5 .5)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>
    </g>

    <!-- left leg -->
    <g transform="translate(-40 90)">
        <g transform="scale(.2 .6)">
            <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
            <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
        </g>
        <g transform="translate(0 70)">
            <g transform="scale(.2 .6)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>
    </g>

    <!-- right leg -->
    <g transform="translate(40 90)">
        <g transform="scale(.2 .6)">
            <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
            <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
        </g>
        <g transform="translate(0 70)">
            <g transform="scale(.2 .6)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>
    </g>

    <!-- left arm (unchanged) -->
    <g transform="translate(-90 -40)">
        <g transform="scale(.6 .2)">
            <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
            <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
        </g>
        <g transform="translate(-70 0)">
            <g transform="scale(.6 .2)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>
    </g>

    <!-- right arm: rotate the whole arm around the shoulder to wave -->
    <g transform="translate(90 -40) rotate(-25)">
        <g transform="scale(.6 .2)">
            <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
            <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
        </g>
        <g transform="translate(70 0)">
            <g transform="scale(.6 .2)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>
    </g>

</g>

</svg>